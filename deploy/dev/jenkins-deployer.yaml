apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: bss-core-dmdm-dev
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: bss-core-dmdm-dev
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - patch
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: bss-core-dmdm-dev
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: bss-core-dmdm-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer
