apiVersion: apps/v1
kind: Deployment
metadata:
  name: bss-core-dmdm-service
  namespace: bss-uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bss-core-dmdm-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bss-core-dmdm-service
    spec:
      nodeSelector:
        workload: app
      containers:
        - name: app
          image: 10.40.2.107/library/bss-core-dmdm-service:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: rwbssdev
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /bss-core-dmdm-service
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: health,info,prometheus
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: POSTGRES_URL
              value: jdbc:postgresql://10.40.3.202:5432/bss_core_dmdm_uat?sslmode=disable
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: bss-core-dmdm-db, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: bss-core-dmdm-db, key: password}
            - name: REDIS_HOST
              value: 10.40.3.203
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: bss-core-dmdm-redis, key: password}
          startupProbe:
            httpGet: {path: /bss-core-dmdm-service/actuator/health, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /bss-core-dmdm-service/actuator/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /bss-core-dmdm-service/actuator/health/liveness, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1536Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: bss-core-dmdm-service
  namespace: bss-uat
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: bss-core-dmdm-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30180
