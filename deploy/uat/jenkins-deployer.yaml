apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bss-core-dmdm-deployer
  namespace: bss-uat
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - bss-core-dmdm-service
    verbs:
      - get
      - patch
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bss-core-dmdm-deployer
  namespace: bss-uat
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: bss-core-dmdm-uat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bss-core-dmdm-deployer
