apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # Legacy single-DB credentials — still the only thing rwbssdev/prod rely on today
  # (no app.tenants configured there; the app falls back to these via SPRING_DATASOURCE_URL).
  DB_HOST: {{ required "db.host is required" .Values.db.host | quote }}
  DB_PORT: {{ default 5432 .Values.db.port | quote }}
  DB_NAME: {{ required "db.name is required" .Values.db.name | quote }}
  DB_USER: {{ required "db.user is required" .Values.db.user | quote }}
  DB_PASSWORD: {{ required "db.password is required" .Values.db.password | quote }}
  DB_SSLMODE: {{ default "require" .Values.db.sslmode | quote }}
  {{- if .Values.app }}
  KL_POSTGRES_URL: "jdbc:postgresql://{{ required "app.tenants.KL.host is required" .Values.app.tenants.KL.host }}:{{ default 5432 .Values.app.tenants.KL.port }}/{{ required "app.tenants.KL.name is required" .Values.app.tenants.KL.name }}?sslmode={{ default "require" .Values.app.tenants.KL.sslmode }}"
  KL_POSTGRES_USER: {{ required "app.tenants.KL.user is required" .Values.app.tenants.KL.user | quote }}
  KL_POSTGRES_PASSWORD: {{ required "app.tenants.KL.password is required" .Values.app.tenants.KL.password | quote }}
  {{- if .Values.app.tenants.LD }}
  LD_POSTGRES_URL: "jdbc:postgresql://{{ required "app.tenants.LD.host is required" .Values.app.tenants.LD.host }}:{{ default 5432 .Values.app.tenants.LD.port }}/{{ required "app.tenants.LD.name is required" .Values.app.tenants.LD.name }}?sslmode={{ default "require" .Values.app.tenants.LD.sslmode }}"
  LD_POSTGRES_USER: {{ required "app.tenants.LD.user is required" .Values.app.tenants.LD.user | quote }}
  LD_POSTGRES_PASSWORD: {{ required "app.tenants.LD.password is required" .Values.app.tenants.LD.password | quote }}
  {{- end }}
  {{- end }}
